<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>3D Chaos Button</title>

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600&display=swap" rel="stylesheet">

  <style>
    body {
      width: 100%;
      height: 100vh;
      margin: 0;
      background: rgb(83, 143, 55);
      display: flex;
      justify-content: center;
      align-items: center;
    }

    button {
      width: 140px;
      height: 50px;
      position: relative;
      background: none;
      border: none;
      padding: 0;
      cursor: pointer;
    }

    /* ---------- TOP ---------- */
    .top {
      width: 100%;
      height: 100%;
      background: rgb(255, 255, 238);
      font-family: Poppins, sans-serif;
      font-size: 16px;
      color: rgb(36, 38, 34);
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 7mm;
      outline: 2px solid rgb(36, 38, 34);
      transition: transform 0.2s ease;
      position: relative;
      overflow: hidden;
      z-index: 2;
    }

    /* ---------- BOTTOM ---------- */
    .bottom {
      position: absolute;
      width: 100%;
      height: 100%;
      background: rgb(229, 229, 199);
      top: 10px;
      left: 0;
      border-radius: 7mm;
      outline: 2px solid rgb(36, 38, 34);
      z-index: 1;
    }

    button::before {
      content: "";
      position: absolute;
      width: calc(100% + 2px);
      height: 100%;
      background: rgb(140, 140, 140);
      top: 14px;
      left: -1px;
      border-radius: 7mm;
      outline: 2px solid rgb(36, 38, 34);
      z-index: 0;
    }

    button:active .top {
      transform: translateY(10px);
    }

    /* ---------- SHINE ---------- */
    .top::before {
      content: "";
      position: absolute;
      width: 15px;
      height: 100%;
      background: rgba(0, 0, 0, 0.1);
      transform: skewX(30deg);
      left: -20px;
      transition: 0.25s;
    }

    button:active .top::before {
      left: calc(100% + 20px);
    }

    /* ===========================
       BUBBLE CLICK ANIMATION
       =========================== */

    button::after,
    button::before {
      pointer-events: none;
    }

    button.animate::before,
    button.animate::after {
      position: absolute;
      content: "";
      width: 150%;
      left: 50%;
      height: 100%;
      transform: translateX(-50%);
      z-index: -10;
      background-repeat: no-repeat;
    }

    button.animate::before {
      top: -70%;
      background-image:
        radial-gradient(circle, #7d2ae8 20%, transparent 20%),
        radial-gradient(circle, transparent 20%, #7d2ae8 20%, transparent 30%),
        radial-gradient(circle, #7d2ae8 20%, transparent 20%),
        radial-gradient(circle, #7d2ae8 20%, transparent 20%),
        radial-gradient(circle, transparent 10%, #7d2ae8 15%, transparent 20%);
      background-size: 10% 10%, 20% 20%, 15% 15%, 20% 20%, 18% 18%;
      animation: topBubbles 0.6s ease;
    }

    button.animate::after {
      bottom: -70%;
      background-image:
        radial-gradient(circle, #7d2ae8 20%, transparent 20%),
        radial-gradient(circle, #7d2ae8 20%, transparent 20%),
        radial-gradient(circle, transparent 10%, #7d2ae8 15%, transparent 20%);
      background-size: 15% 15%, 20% 20%, 18% 18%;
      animation: bottomBubbles 0.6s ease;
    }

    @keyframes topBubbles {
      0% {
        background-position: 10% 90%, 30% 90%, 50% 90%, 70% 90%, 90% 90%;
      }

      100% {
        background-position: 10% 10%, 30% 20%, 50% 0%, 70% 30%, 90% 10%;
        background-size: 0 0;
      }
    }

    @keyframes bottomBubbles {
      0% {
        background-position: 20% -10%, 50% -10%, 80% -10%;
      }

      100% {
        background-position: 20% 90%, 50% 100%, 80% 90%;
        background-size: 0 0;
      }
    }



    .bubble-wrap {
      position: relative;
      display: inline-block;
    }

    .bubble-wrap::before,
    .bubble-wrap::after {
      content: "";
      position: absolute;
      width: 200%;
      height: 100%;
      left: 50%;
      transform: translateX(-50%);
      background-repeat: no-repeat;
      pointer-events: none;
      opacity: 0;
    }

    .bubble-wrap.animate::before {
      top: -70%;
      opacity: 1;
      background-image:
        radial-gradient(circle, #7d2ae8 20%, transparent 20%),
        radial-gradient(circle, transparent 20%, #7d2ae8 20%, transparent 30%),
        radial-gradient(circle, #7d2ae8 20%, transparent 20%),
        radial-gradient(circle, #7d2ae8 20%, transparent 20%);
      background-size: 12% 12%, 18% 18%, 14% 14%, 16% 16%;
      animation: topBubbles 0.6s ease;
    }

    .bubble-wrap.animate::after {
      bottom: -70%;
      opacity: 1;
      background-image:
        radial-gradient(circle, #7d2ae8 20%, transparent 20%),
        radial-gradient(circle, #7d2ae8 20%, transparent 20%),
        radial-gradient(circle, transparent 10%, #7d2ae8 15%, transparent 20%);
      background-size: 16% 16%, 18% 18%, 14% 14%;
      animation: bottomBubbles 0.6s ease;
    }

    .bubble-wrap::before,
    .bubble-wrap::after {
      z-index: -5;
    }


    @keyframes topBubbles {
      from {
        background-position: 20% 90%, 40% 90%, 60% 90%, 80% 90%;
      }

      to {
        background-position: 20% 10%, 40% 0%, 60% 20%, 80% 10%;
        background-size: 0 0;
      }
    }

    @keyframes bottomBubbles {
      from {
        background-position: 30% -10%, 50% -10%, 70% -10%;
      }

      to {
        background-position: 30% 90%, 50% 100%, 70% 90%;
        background-size: 0 0;
      }
    }
  </style>
</head>

<body>

  <div class="bubble-wrap" id="bubbleWrap">
    <button id="chaosBtn">
      <div class="top">CLICK ME</div>
      <div class="bottom"></div>
    </button>
  </div>

  <!-- 🔊 Sound -->
  <audio id="popSound" src="pop.mp3" preload="auto"></audio>

  <script src="njdfgoe.js"></script>


</body>

</html>
